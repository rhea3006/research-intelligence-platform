services:
  - type: web
    name: research-intelligence-platform
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

  - type: cron
    name: research-intelligence-ingestion
    runtime: python

    schedule: "0 */6 * * *"

    buildCommand: pip install -r requirements.txt

    startCommand: python -m ingestion.ingest_paper